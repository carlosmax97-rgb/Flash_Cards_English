<!-- deck.html -->

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Flash Cards English</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="deck-topbar">
    <button type="button" id="backBtn" class="deck-topbar-slot" aria-label="Volver">
      <svg class="icon-arrow icon-arrow--mirror" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1280" fill="currentColor" aria-hidden="true"><path d="M617 373v78H158v399h459l.2 84.9.3 84.9 155-112.5 323.3-234.6c36.8-26.7 45.1-33.2 44-34.2-.7-.6-27.6-18.4-59.8-39.5s-95.8-62.9-141.5-92.8c-45.6-30-90-59.1-98.5-64.7-75.8-49.7-215.4-141.4-218.7-143.7l-4.3-2.9z"/></svg>
    </button>
    <p id="progress" class="deck-topbar-slot">
      1 / 15
    </p>
  </header>

  <main class="study-screen">
    <!-- CARD -->
    <section class="flashcard" id="flashcard">
      <div class="card-content">
        <p class="card-text" id="cardText">
          I'm alright
        </p>
        <p class="card-hint" id="cardHint">
          Tap to reveal
        </p>
      </div>
    </section>

    <!-- AUDIO -->
    <button class="audio-btn" id="audioBtn">
      🔊
    </button>

    <!-- NAVIGATION -->
    <section class="navigation">
      <button type="button" class="nav-btn" id="prevBtn" aria-label="Tarjeta anterior">
        <svg class="icon-arrow icon-arrow--mirror" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1280" fill="currentColor" aria-hidden="true"><path d="M617 373v78H158v399h459l.2 84.9.3 84.9 155-112.5 323.3-234.6c36.8-26.7 45.1-33.2 44-34.2-.7-.6-27.6-18.4-59.8-39.5s-95.8-62.9-141.5-92.8c-45.6-30-90-59.1-98.5-64.7-75.8-49.7-215.4-141.4-218.7-143.7l-4.3-2.9z"/></svg>
      </button>
      <button type="button" class="nav-btn" id="nextBtn" aria-label="Tarjeta siguiente">
        <svg class="icon-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1280" fill="currentColor" aria-hidden="true"><path d="M617 373v78H158v399h459l.2 84.9.3 84.9 155-112.5 323.3-234.6c36.8-26.7 45.1-33.2 44-34.2-.7-.6-27.6-18.4-59.8-39.5s-95.8-62.9-141.5-92.8c-45.6-30-90-59.1-98.5-64.7-75.8-49.7-215.4-141.4-218.7-143.7l-4.3-2.9z"/></svg>
      </button>
    </section>
  </main>

  <script src="js/deck.js"></script>
</body>
</html>
