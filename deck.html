<!-- deck.html -->

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">
  <title>Flash Cards English</title>
  <link rel="stylesheet" href="css/styles.css">
  <!--google fonts-->

</head>
<body>
  <header class="deck-topbar">
    <button type="button" id="backBtn" class="deck-topbar-slot" aria-label="Volver">
      <svg class="icon-arrow icon-arrow--mirror" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1280" fill="currentColor" aria-hidden="true"><path d="M617 373v78H158v399h459l.2 84.9.3 84.9 155-112.5 323.3-234.6c36.8-26.7 45.1-33.2 44-34.2-.7-.6-27.6-18.4-59.8-39.5s-95.8-62.9-141.5-92.8c-45.6-30-90-59.1-98.5-64.7-75.8-49.7-215.4-141.4-218.7-143.7l-4.3-2.9z"/></svg>
    </button>
    <!--
    <p id="progress" class="deck-topbar-slot">
      1 / 16
    </p>
    -->
  </header>

  <main class="study-screen">
    <!-- CARD -->
    <section class="flashcard" id="flashcard">
      <div class="card-content">
        <p class="card-text" id="cardText">
          I'm alright
        </p>
        <p class="card-hint" id="cardHint">
          Tap to reveal
        </p>
      </div>
    </section>

    <!-- CLASIFICAR TARJETA -->
    <div class="review-buttons">
      <button id="btn-good" class="good">
        <svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="28" height="28" fill="currentColor"><path d="M26.453 14.806c.344.158.643.383.857.705.398.596.382 1.405.078 2.055-.279.596-.77 1.07-1.322 1.435.344.158.642.383.856.705.398.597.382 1.405.079 2.055-.266.569-.726 1.027-1.246 1.384.338.135.634.338.839.645.337.506.31 1.183.066 1.74-.57 1.304-2.404 2.47-6.51 2.47h-6.682c-1.483 0-3.088-.547-4.379-1.583a2.374 2.364 0 0 1-.884-1.84V13.245c0-.664.285-1.294.774-1.745 1.509-1.392 2.566-3.657 3.135-5.541.808-2.676-.727-5.343 1.533-5.871 2.252-.527 3.35 1.435 3.766 2.622.953 2.726.688 5.847-.695 8.381 3.296-.69 5.048-.852 8.14-.852 1.054 0 2.257.202 2.84 1.076.397.597.381 1.406.078 2.056-.28.596-.77 1.07-1.323 1.435M5.671 26.805H1.306A1.303 1.303 0 0 1 0 25.505V12.822a1.303 1.303 0 0 1 1.306-1.3H5.67a1.303 1.303 0 0 1 1.306 1.3v12.683a1.303 1.303 0 0 1-1.306 1.3"/></svg>
      </button>
      <button id="btn-bad" class="bad">
        <svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="28" height="28" fill="currentColor"><path d="M1.547 13.194a2 2 0 0 1-.857-.705c-.398-.596-.382-1.405-.078-2.055.279-.596.77-1.07 1.322-1.435a2 2 0 0 1-.856-.705C.68 7.697.696 6.89.999 6.24c.266-.569.726-1.027 1.246-1.384-.338-.135-.634-.338-.839-.646-.337-.505-.31-1.182-.066-1.738C1.91 1.166 3.744 0 7.85 0h6.682c1.483 0 3.088.547 4.379 1.583a2.374 2.364 0 0 1 .884 1.84v11.332c0 .664-.285 1.293-.774 1.745-1.509 1.391-2.566 3.657-3.135 5.541-.808 2.676.727 5.343-1.533 5.871-2.252.527-3.35-1.435-3.766-2.622-.953-2.726-.688-5.847.695-8.381-3.296.69-5.048.852-8.14.852-1.054 0-2.257-.202-2.84-1.076-.397-.597-.381-1.406-.078-2.056.28-.596.77-1.07 1.323-1.435M22.329 1.195h4.365A1.303 1.303 0 0 1 28 2.495v12.683a1.303 1.303 0 0 1-1.306 1.3H22.33a1.303 1.303 0 0 1-1.306-1.3V2.494a1.303 1.303 0 0 1 1.306-1.3"/></svg>
      </button>
    </div>

    <!-- AUDIO -->
    <button class="audio-btn" id="audioBtn" aria-label="Reproducir audio">
      <svg class="icon-speaker" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1059" fill="currentColor" aria-hidden="true">
        <path d="M750.6 25.1c-.6 20.5-.5 25.3.6 26 .7.5 6.3.9 12.4.9 24.2 0 60.1 4.3 88.9 10.6C952 84.2 1042 137.3 1109.4 214c62.9 71.5 103.3 160.5 115 253.5 5 39.1 5 84 0 123-17.7 139.6-97.7 265.5-217.4 342.1-69.4 44.5-154.3 71.4-233 74-9.1.2-18.9.7-21.7 1l-5.3.5v51.2l19-.7c77.7-2.8 146.2-19.5 213.8-52.2 108.5-52.4 195.2-138.9 247.1-246.6 64.7-134.2 70.4-287 15.8-425.8-25.5-64.7-65-125.1-115.6-176.3C1042.1 71.4 930.9 17.2 811 3.5 796.3 1.9 768.4 0 757.9 0h-6.6zM513.9 152.6c-76.7 74.2-155.4 150.2-174.7 168.9l-35.2 34-141.3.5-141.2.5-4.7 2.2C10.5 361.6 4.5 368 2 374.6c-2 5.5-2 6.3-1.8 158.2l.3 152.7 3.1 5.5c1.7 3 5 7 7.3 8.7 8.6 6.6.2 6.3 153 6.4h138.6L478 877l175.5 170.9.3-257.5c.1-141.6.1-373.3 0-515l-.3-257.7z"/>
        <path d="M751.7 189.2c-.4 2.9-.7 7.8-.7 10.9v5.6l13.8.7c23.2 1.1 42.6 3.8 65 9.2 123 29.7 218.9 129.7 243.6 253.9 5.3 26.6 6.1 35.1 6.1 65.5-.1 27.5-.7 35.3-4.5 57-10.1 57.1-34.9 109.9-72.8 155-10.2 12.2-33 34.4-45.2 44.1-53 42.2-119.2 68.1-182.2 71.4-6.2.3-14.6.8-18.5 1.1l-7.3.6v21.1l17.8-.6c37.2-1.3 77.8-9.8 112.9-23.7 105.5-42 184.7-132.3 211.7-241.5 7.4-29.9 10.1-52.9 10-85.5 0-46.3-6.8-82.9-23.3-126.3-36.4-95.5-117.4-172.6-215.6-205.2-33-11-59.6-15.8-99.1-18l-11.1-.6z"/>
        <path d="M721 365.7v6.9l13.3 1.2c16.2 1.5 25.1 3.3 38.6 7.8 54 17.9 95.3 63.9 107.8 119.9 3 13.6 4.2 41 2.4 55-7.4 57.7-44.9 107.2-98.4 130-17.4 7.5-38.9 12.2-56.9 12.6l-7.8.2V714h5c13.9 0 36.2-3.9 52.5-9.1 12.4-4 35.1-15.6 46.4-23.6 24.2-17.4 44.2-41.1 57.1-67.8 24.1-49.9 23.8-106.2-.7-156.3-27.3-55.9-86.4-95.1-147.5-97.9l-11.8-.6z"/>
      </svg>
    </button>

    <!-- NAVIGATION -->
    <section class="navigation">
      <button type="button" class="nav-btn" id="prevBtn" aria-label="Tarjeta anterior">
        <svg class="icon-arrow icon-arrow--mirror" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1280" fill="currentColor" aria-hidden="true"><path d="M617 373v78H158v399h459l.2 84.9.3 84.9 155-112.5 323.3-234.6c36.8-26.7 45.1-33.2 44-34.2-.7-.6-27.6-18.4-59.8-39.5s-95.8-62.9-141.5-92.8c-45.6-30-90-59.1-98.5-64.7-75.8-49.7-215.4-141.4-218.7-143.7l-4.3-2.9z"/></svg>
      </button>

    <!--PROBANDO CONTADOR-->
    <p id="progress" class="contador">
      1 / 16
    </p>

      <button type="button" class="nav-btn" id="nextBtn" aria-label="Tarjeta siguiente">
        <svg class="icon-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1280" fill="currentColor" aria-hidden="true"><path d="M617 373v78H158v399h459l.2 84.9.3 84.9 155-112.5 323.3-234.6c36.8-26.7 45.1-33.2 44-34.2-.7-.6-27.6-18.4-59.8-39.5s-95.8-62.9-141.5-92.8c-45.6-30-90-59.1-98.5-64.7-75.8-49.7-215.4-141.4-218.7-143.7l-4.3-2.9z"/></svg>
      </button>
    </section>

  </main>

  <!--POP-UP RESULTADOS-->
  <div id="results-popup" class="popup hidden">
    <div class="popup-content">
      <h2>Session Finished</h2>
      <div class="results">
        <p class="good-result">
          Remembered: <span id="good-count">0</span>
        </p>
        <p class="bad-result">
          Forgotten: <span id="bad-count">0</span>
        </p>
      </div>
      <button id="restart-btn">
        Restart Deck
      </button>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/deck.js"></script>
</body>
</html>
