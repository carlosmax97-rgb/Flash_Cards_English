<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <title>FLASH_CARDS</title>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>English Flash Cards</h1>
            <p>Domina el inglés usando tarjetas</p>
        </div>

        <!-- CARD -->
        <div class="card" id="card">

            <div class="card-inner">

                <!-- FRONT -->
                <div class="card-front">

                    <div id="diff" class="difficulty"></div>

                    <div id="front-text"></div>

                    <p class="hint">
                        Click para ver la traducción...
                    </p>

                </div>

                <!-- BACK -->
                <div class="card-back" id="back-text">
                    <!-- Se llena con JS -->
                </div>

            </div>
        </div>

        <!-- AUDIO BUTTON -->
        <button class="audio-btn" onclick="playAudio()">
            🔊
        </button>

        <!-- CONTROLS -->
        <div class="controls">
            <button onclick="prevCard()">Anterior</button>

            <span id="counter">1 / 15</span>

            <button onclick="nextCard()">Siguiente</button>
        </div>


    </div>

    <!-- AUDIO -->
    <audio id="player"></audio>

    <!-- JS -->
    <script src="js/app.js"></script>

</body>

</html>
